<html lang="en">
<head>


<!-- Modify head icon -->
 <!-- Circle with gradient -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237c3aed'/></svg>">





  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>✦ Profile</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at 20% 30%, #0d0b1a, #03020a);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      padding: 1.5rem;
      transition: background 0.5s cubic-bezier(0.23, 1, 0.32, 1), color 0.3s ease;
    }

    /* light mode body */
    body.light-mode {
      background: radial-gradient(circle at 20% 30%, #f0ebf8, #ddd6e8);
    }

    /* ——— main card ——— */
    .profile-card {
      max-width: 780px;
      width: 100%;
      background: rgba(16, 14, 30, 0.7);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 3.5rem 1.5rem 3.5rem 1.5rem;
      padding: 2.8rem 2.8rem 2.4rem;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 215, 250, 0.08), 0 0 50px rgba(140, 60, 255, 0.2);
      border: 1px solid rgba(255, 220, 255, 0.06);
      transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
      position: relative;
      overflow: hidden;
    }

    /* light mode card */
    body.light-mode .profile-card {
      background: rgba(245, 240, 255, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.06), 0 0 0 1px rgba(120, 80, 200, 0.08), 0 0 50px rgba(150, 100, 255, 0.05);
      border: 1px solid rgba(200, 180, 255, 0.2);
    }

    /* animated glow — refined */
    .profile-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg at 50% 50%, rgba(200, 100, 255, 0.04), rgba(0, 180, 255, 0.04), rgba(200, 100, 255, 0.04));
      animation: rotateGlow 25s linear infinite;
      z-index: 0;
      pointer-events: none;
    }

    body.light-mode .profile-card::before {
      background: conic-gradient(from 0deg at 50% 50%, rgba(150, 100, 255, 0.05), rgba(80, 150, 255, 0.05), rgba(150, 100, 255, 0.05));
    }

    @keyframes rotateGlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .profile-card > * {
      position: relative;
      z-index: 2;
    }

    /* ——— top bar: theme toggle + status ——— */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .theme-toggle {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 215, 255, 0.08);
      color: #cdc0e6;
      padding: 0.5rem 1.2rem 0.5rem 1.4rem;
      border-radius: 60px;
      font-size: 0.85rem;
      font-weight: 400;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      transition: all 0.3s ease;
      backdrop-filter: blur(4px);
      font-family: inherit;
      letter-spacing: 0.3px;
    }

    .theme-toggle i {
      font-size: 1rem;
      transition: 0.3s;
    }

    .theme-toggle:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(210, 170, 255, 0.25);
      transform: scale(1.02);
      box-shadow: 0 0 20px rgba(140, 60, 255, 0.05);
    }

    body.light-mode .theme-toggle {
      background: rgba(0, 0, 0, 0.03);
      border-color: rgba(120, 80, 200, 0.08);
      color: #2d2442;
    }

    body.light-mode .theme-toggle:hover {
      background: rgba(0, 0, 0, 0.06);
      border-color: rgba(120, 80, 200, 0.15);
    }

    .status-pulse {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(20, 230, 150, 0.06);
      padding: 0.3rem 1.2rem 0.3rem 0.9rem;
      border-radius: 60px;
      border: 1px solid rgba(20, 230, 150, 0.08);
      color: #a5f0d0;
      font-size: 0.8rem;
      font-weight: 400;
      transition: background 0.3s, color 0.3s, border-color 0.3s;
      backdrop-filter: blur(4px);
    }

    body.light-mode .status-pulse {
      background: rgba(20, 180, 120, 0.04);
      color: #1d7a5a;
      border-color: rgba(20, 180, 120, 0.1);
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background: #4effb5;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 14px #4effb5;
      animation: pulse 2s infinite;
    }

    body.light-mode .pulse-dot {
      background: #2b9e7a;
      box-shadow: 0 0 14px #2b9e7a;
    }

    @keyframes pulse {
      0% { opacity: 0.5; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.5; transform: scale(0.9); }
    }

    /* ——— avatar ——— */
    .avatar-wrapper {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 1.8rem;
      flex-wrap: wrap;
    }

    .avatar-icon {
      font-size: 4.4rem;
      color: #c89bff;
      background: rgba(200, 155, 255, 0.06);
      width: 5.8rem;
      height: 5.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 40% 60% 40% 60% / 60% 40% 60% 40%;
      border: 1.5px solid rgba(255, 200, 255, 0.15);
      box-shadow: 0 0 30px rgba(200, 100, 255, 0.08);
      transition: 0.4s;
    }

    body.light-mode .avatar-icon {
      color: #7a4fbf;
      background: rgba(120, 80, 200, 0.05);
      border-color: rgba(120, 80, 200, 0.12);
      box-shadow: 0 0 30px rgba(120, 80, 200, 0.04);
    }

    .avatar-icon i {
      filter: drop-shadow(0 0 10px #b77aff);
    }

    body.light-mode .avatar-icon i {
      filter: drop-shadow(0 0 10px #9a6cdb);
    }

    .name-title h1 {
      font-size: 2.4rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: #f4eeff;
      text-shadow: 0 0 20px rgba(200, 150, 255, 0.15);
      transition: color 0.3s;
    }

    body.light-mode .name-title h1 {
      color: #1f1735;
      text-shadow: 0 0 20px rgba(120, 80, 200, 0.04);
    }

    .name-title .tagline {
      font-size: 1rem;
      font-weight: 300;
      color: #b8a9d4;
      letter-spacing: 0.6px;
      display: inline-block;
      padding: 0.2rem 1.2rem 0.2rem 0;
      border-radius: 40px;
      border-left: 2.5px solid #a97cff;
      padding-left: 1rem;
      margin-top: 4px;
      transition: color 0.3s, border-color 0.3s;
    }

    body.light-mode .name-title .tagline {
      color: #4a3a6b;
      border-left-color: #7a4fbf;
    }

    /* ——— bio ——— */
    .bio {
      margin: 1.6rem 0 2.4rem 0;
      padding: 0.8rem 0;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      transition: border-color 0.3s;
    }

    body.light-mode .bio {
      border-color: rgba(0, 0, 0, 0.04);
    }

    .bio p {
      color: #cdc0e6;
      font-size: 1.05rem;
      line-height: 1.7;
      font-weight: 300;
      letter-spacing: 0.2px;
      transition: color 0.3s;
    }

    body.light-mode .bio p {
      color: #2d2442;
    }

    .bio span {
      color: #d9b8ff;
      font-weight: 400;
      background: linear-gradient(120deg, #ba8cff, #d4aaff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    body.light-mode .bio span {
      background: linear-gradient(120deg, #7a4fbf, #9a6cdb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ——— social grid ——— refined spacing & shapes */
    .social-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin: 2.4rem 0 2rem 0;
    }

    .social-item {
      background: rgba(26, 22, 48, 0.5);
      backdrop-filter: blur(4px);
      border-radius: 2.2rem 0.8rem 2.2rem 0.8rem;
      padding: 0.9rem 0.4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      border: 1px solid rgba(255, 215, 255, 0.04);
      transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
      color: #dfd6f5;
      text-decoration: none;
      font-weight: 300;
      font-size: 0.75rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      text-align: center;
      min-height: 88px;
      position: relative;
      overflow: hidden;
    }

    /* subtle shine */
    .social-item::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.02), transparent 70%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s;
    }

    .social-item:hover::after {
      opacity: 1;
    }

    body.light-mode .social-item {
      background: rgba(240, 235, 255, 0.5);
      border: 1px solid rgba(120, 80, 200, 0.04);
      color: #2d2442;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
    }

    .social-item i {
      font-size: 2.2rem;
      color: #c7adff;
      transition: 0.3s;
      margin-bottom: 0.1rem;
    }

    body.light-mode .social-item i {
      color: #7a4fbf;
    }

    .social-item span {
      letter-spacing: 0.3px;
      font-size: 0.65rem;
      text-transform: uppercase;
      opacity: 0.6;
      font-weight: 400;
      transition: opacity 0.3s;
    }

    .social-item:hover {
      transform: translateY(-6px) scale(1.03);
      background: rgba(50, 40, 80, 0.7);
      border-color: rgba(210, 170, 255, 0.2);
      box-shadow: 0 16px 40px rgba(100, 50, 200, 0.15);
    }

    body.light-mode .social-item:hover {
      background: rgba(220, 210, 255, 0.6);
      border-color: rgba(120, 80, 200, 0.15);
      box-shadow: 0 16px 40px rgba(120, 80, 200, 0.06);
    }

    .social-item:hover i {
      color: white;
      filter: drop-shadow(0 0 12px currentColor);
    }

    body.light-mode .social-item:hover i {
      color: #2d1b4e;
      filter: drop-shadow(0 0 12px rgba(120, 80, 200, 0.2));
    }

    .social-item:hover span {
      opacity: 1;
    }

    /* platform colors - dark mode */
    .social-item.instagram:hover i { color: #e4405f; }
    .social-item.facebook:hover i { color: #1877f2; }
    .social-item.youtube:hover i { color: #ff0033; }
    .social-item.discord:hover i { color: #5865f2; }
    .social-item.github:hover i { color: #f0f0f0; }
    .social-item.spotify:hover i { color: #1ed760; }
    .social-item.linkedin:hover i { color: #0a66c2; }
    .social-item.website:hover i { color: #ffb3a6; }

    /* platform colors - light mode (FIXED) */
    body.light-mode .social-item.instagram:hover i { color: #e4405f; }
    body.light-mode .social-item.facebook:hover i { color: #1877f2; }
    body.light-mode .social-item.youtube:hover i { color: #ff0033; }
    body.light-mode .social-item.discord:hover i { color: #5865f2; }
    body.light-mode .social-item.github:hover i { color: #1a1a1a; }
    body.light-mode .social-item.spotify:hover i { color: #1ed760; }
    body.light-mode .social-item.linkedin:hover i { color: #0a66c2; }
    body.light-mode .social-item.website:hover i { color: #cc7a6a; }

    /* ——— footer ——— */
    .profile-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 1.8rem;
      padding-top: 1.2rem;
      border-top: 1px solid rgba(255, 200, 255, 0.04);
      color: #80719b;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      transition: border-color 0.3s, color 0.3s;
    }

    body.light-mode .profile-footer {
      border-top-color: rgba(0, 0, 0, 0.04);
      color: #5a4a7a;
    }

    .footer-credit {
      opacity: 0.5;
      font-weight: 300;
    }

    .footer-credit i {
      margin: 0 4px;
      color: #b58aff;
    }

    body.light-mode .footer-credit i {
      color: #7a4fbf;
    }

    /* glitch line */
    .glitch-line {
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(200, 150, 255, 0.12), rgba(255, 100, 200, 0.12), transparent);
      margin: 0.2rem 0 0.2rem 0;
      transition: background 0.3s;
    }

    body.light-mode .glitch-line {
      background: linear-gradient(90deg, transparent, rgba(120, 80, 200, 0.06), rgba(200, 150, 255, 0.06), transparent);
    }

    /* responsive */
    @media (max-width: 640px) {
      .profile-card { padding: 2rem 1.5rem; border-radius: 2.5rem 1rem 2.5rem 1rem; }
      .avatar-icon { font-size: 3.4rem; width: 4.8rem; height: 4.8rem; }
      .name-title h1 { font-size: 1.9rem; }
      .social-grid { grid-template-columns: repeat(2, 1fr); gap: 0.8rem; }
      .social-item { min-height: 72px; padding: 0.6rem 0.3rem; }
      .social-item i { font-size: 1.8rem; }
      .top-bar { flex-direction: column; align-items: stretch; gap: 0.6rem; }
      .theme-toggle { justify-content: center; }
      .status-pulse { justify-content: center; }
      .profile-footer { justify-content: center; }
    }

    @media (max-width: 400px) {
      .social-grid { grid-template-columns: 1fr 1fr; gap: 0.6rem; }
      .avatar-wrapper { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>

  <script>
    (function() {
      const toggleBtn = document.getElementById('themeToggle');
      const themeIcon = document.getElementById('themeIcon');
      const themeLabel = document.getElementById('themeLabel');
      const body = document.body;

      const currentTheme = localStorage.getItem('theme') || 'dark';
      if (currentTheme === 'light') {
        body.classList.add('light-mode');
        themeIcon.className = 'fas fa-sun';
        themeLabel.textContent = 'light';
      } else {
        body.classList.remove('light-mode');
        themeIcon.className = 'fas fa-moon';
        themeLabel.textContent = 'dark';
      }

      toggleBtn.addEventListener('click', () => {
        body.classList.toggle('light-mode');
        const isLight = body.classList.contains('light-mode');
        if (isLight) {
          themeIcon.className = 'fas fa-sun';
          themeLabel.textContent = 'light';
          localStorage.setItem('theme', 'light');
        } else {
          themeIcon.className = 'fas fa-moon';
          themeLabel.textContent = 'dark';
          localStorage.setItem('theme', 'dark');
        }
      });
    })();
  </script>
